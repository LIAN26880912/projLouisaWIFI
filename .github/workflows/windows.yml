name: Windows CI

on:
  push:
    branches: [main]
    paths: ["windows/**", "data/**", "app/AppIcon.png", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "data/**", "app/AppIcon.png", ".github/workflows/windows.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - run: dotnet test LouisaWiFi.Windows.slnx --configuration Release
